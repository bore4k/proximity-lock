name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ProximityLock.xcodeproj \
            -scheme ProximityLock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ProximityLock.app Payload/
          zip -qry ProximityLock.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ProximityLock-ipa
          path: ios/ProximityLock.ipa
